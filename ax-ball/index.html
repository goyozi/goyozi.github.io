<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c14" />
    <meta
      name="description"
      content="AX Ball, a local arcade brick breaker with a twelve-level campaign and a level editor."
    />
    <title>AX Ball — Arcade</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2311111c'/%3E%3Cpath fill='%23b097ff' d='M2 3h5v2H2zm7 0h5v2H9zM2 6h5v2H2z'/%3E%3Cpath fill='%2355e5de' d='M10 9h2v2h-2zM4 12h8v2H4z'/%3E%3C/svg%3E"
    />
    <style>
:root {
  color-scheme: dark;
  --bg: #0c0c13;
  --panel: #15151f;
  --line: #2b2b3d;
  --text: #f3f2fb;
  --muted: #a1a0b5;
  --purple: #b69afa;
  --cyan: #65e2dd;
  --pink: #ff699f;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --sans: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  font-family: var(--sans);
  font-size: clamp(14px, 1.055vw, 28px);
  background: var(--bg);
  color: var(--text);
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  min-height: 100%;
  width: 100%;
}
body {
  background: radial-gradient(ellipse at 55% -40%, #252033 0, transparent 57%), #0c0c13;
  min-height: 100dvh;
}
button,
input,
select {
  font: inherit;
}
button {
  color: inherit;
  cursor: pointer;
  background: none;
  border: 0;
}
button:disabled {
  cursor: default;
  opacity: 0.46;
}
button:focus-visible,
a:focus-visible,
canvas:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}
button {
  touch-action: manipulation;
}
button:hover:enabled {
  filter: brightness(1.14);
}
[hidden] {
  display: none !important;
}
h1,
h2,
h3,
p {
  margin: 0;
}
.icon {
  width: 1.18em;
  height: 1.18em;
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}
.pixel {
  display: block;
  overflow: visible;
  shape-rendering: crispEdges;
}
.topbar {
  height: 5rem;
  background: #101018;
  border-bottom: 1px solid #2a2837;
}
.topbar-inner,
#main {
  width: min(94%, 108rem);
  margin: auto;
}
.topbar-inner {
  height: 100%;
  display: flex;
  align-items: center;
  gap: 3rem;
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0;
  flex-shrink: 0;
}
.brand-symbol {
  width: 2.32rem;
  height: 2.32rem;
}
.brand-word {
  width: 8.5rem;
  height: 2rem;
  overflow: visible;
}
.topbar nav {
  height: 100%;
  display: flex;
  align-items: stretch;
  gap: 0.5rem;
}
nav button {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  padding: 0 0.95rem;
  color: #aaa8bb;
  font-size: 0.92rem;
  font-weight: 560;
  white-space: nowrap;
}
nav button.active {
  color: #c6a8ff;
}
nav button.active:after {
  content: '';
  position: absolute;
  height: 3px;
  background: #b18cfa;
  bottom: -1px;
  left: 0.7rem;
  right: 0.7rem;
  box-shadow: 0 -2px 12px #b078ff32;
}
nav button:hover {
  color: white;
}
.utilities {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 0.48rem;
}
.icon-button,
.language-button,
.small-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  border: 1px solid var(--line);
  border-radius: 0.45rem;
  background: #171721;
  color: #c5c3d3;
  height: 2.45rem;
}
.icon-button {
  width: 2.55rem;
}
.language-button {
  padding: 0 0.7rem;
  font-size: 0.8rem;
  font-weight: 700;
}
.language-button .chev {
  width: 0.8rem;
}
.language-wrap {
  position: relative;
  margin-left: 0.16rem;
}
.language-menu {
  position: absolute;
  min-width: 10rem;
  right: 0;
  top: calc(100% + 0.5rem);
  padding: 0.3rem;
  background: #1c1a28;
  z-index: 12;
  border: 1px solid #41394f;
  border-radius: 0.5rem;
  box-shadow: 0 0.5rem 2rem #0008;
}
.language-menu button {
  display: flex;
  gap: 0.6rem;
  align-items: center;
  text-align: left;
  width: 100%;
  padding: 0.6rem;
  border-radius: 0.25rem;
}
.language-menu button[aria-checked='true'] {
  color: var(--purple);
  background: #2c263b;
}
.language-menu small {
  font-family: var(--mono);
  color: var(--muted);
}
#main {
  height: calc(100dvh - 5rem);
  padding: 1.8rem 0 1rem;
}
.arcade {
  height: 100%;
  display: flex;
  flex-direction: column;
  max-height: 76rem;
}
.stage-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.3rem;
  flex-shrink: 0;
}
.eyebrow,
.card-label,
.progress-heading,
.score-bars,
.champ-eyebrow {
  font-family: var(--mono);
  font-size: 0.7rem;
  font-weight: 650;
  letter-spacing: 0.145em;
  text-transform: uppercase;
}
.campaign-label {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  color: #b5a0dc;
}
.campaign-label #level-index {
  color: #9997ac;
}
.crumb-slash {
  color: #504960;
}
.signal-bars,
.score-bars {
  display: inline-flex;
  gap: 2px;
  align-items: center;
}
.signal-bars i {
  height: 0.65rem;
  width: 0.22rem;
  background: #ac85f7;
  transform: skewX(-25deg);
}
.signal-bars i:nth-child(2) {
  opacity: 0.7;
}
.signal-bars i:nth-child(3) {
  opacity: 0.42;
}
h1 {
  font-size: clamp(2.15rem, 2.55vw, 3.5rem);
  line-height: 1.15;
  letter-spacing: -0.047em;
  font-weight: 710;
}
.stage-heading h1 {
  margin-top: 0.33rem;
}
.stage-tools {
  display: flex;
  align-items: center;
  gap: 0.55rem;
}
.small-button {
  padding: 0 0.9rem;
  font-size: 0.82rem;
  font-weight: 580;
}
.small-button .icon {
  width: 1rem;
}
.console-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) clamp(17.25rem, 20.8vw, 25.5rem);
  gap: 1.25rem;
  min-height: 0;
  flex: 1;
}
.field-column {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.arena-frame {
  min-height: 0;
  flex: 1;
  background: linear-gradient(135deg, #687297 0%, #514666 19%, #423954 58%, #85698e 100%);
  padding: 2px;
  border-radius: 0.78rem;
  box-shadow:
    0 0.6rem 2.2rem #0005,
    inset 0 0 0 1px #bcb0de15;
  position: relative;
  overflow: hidden;
}
#arena {
  border-radius: calc(0.78rem - 2px);
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: #0b1025;
}
#arena canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#scenery {
  z-index: -1;
  image-rendering: pixelated;
}
#game {
  touch-action: none;
  outline-offset: -4px;
}
.corner {
  position: absolute;
  width: 0.96rem;
  height: 0.96rem;
  border-color: #aba2c365;
  pointer-events: none;
  border-style: solid;
  border-width: 0;
}
.tl {
  left: 0.57rem;
  top: 0.57rem;
  border-left-width: 2px;
  border-top-width: 2px;
}
.tr {
  right: 0.57rem;
  top: 0.57rem;
  border-right-width: 2px;
  border-top-width: 2px;
}
.bl {
  left: 0.57rem;
  bottom: 0.57rem;
  border-left-width: 2px;
  border-bottom-width: 2px;
}
.br {
  right: 0.57rem;
  bottom: 0.57rem;
  border-right-width: 2px;
  border-bottom-width: 2px;
}
#arena-status {
  position: absolute;
  left: 1.35rem;
  top: 1.15rem;
  display: inline-flex;
  align-items: center;
  gap: 0.43rem;
  color: #bac2d8;
  font: 0.66rem var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  pointer-events: none;
}
#arena-status i {
  width: 0.4rem;
  height: 0.4rem;
  background: #63e5c4;
  box-shadow: 0 0 0.5rem #53ffd675;
}
#arena-status[data-state='paused'] i,
#arena-status[data-state='gameover'] i {
  background: #ffd07c;
}
.game-prompt {
  position: absolute;
  top: 67%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 1;
  pointer-events: none;
}
.game-prompt button {
  pointer-events: auto;
}
.launch-button,
.action-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.68rem;
  color: #180e2b;
  background: #b89afd;
  border: 1px solid #d0b6ff;
  border-bottom-color: #9d7bc7;
  border-radius: 0.38rem;
  min-height: 2.75rem;
  padding: 0.65rem 1.25rem;
  font-size: 0.93rem;
  font-weight: 720;
  box-shadow:
    0 3px 0 #594071,
    0 0 1.4rem #a570ff19;
  white-space: nowrap;
}
.launch-button .icon {
  width: 1rem;
}
.launch-hint {
  display: block;
  margin-top: 0.66rem;
  color: #ccc4da;
  font: 0.73rem var(--mono);
  text-shadow: 0 1px 3px #100b20;
}
.key-inline {
  font-weight: 670;
  color: #e5d9fa;
}
.game-prompt.message {
  top: 59%;
  padding: 1.2rem 1.65rem;
  background: #131221f0;
  border: 1px solid #504361;
  border-radius: 0.7rem;
  box-shadow: 0 0.5rem 2rem #0008;
  min-width: 15rem;
}
.game-prompt h2 {
  font-size: 1.45rem;
  margin-bottom: 0.35rem;
}
.game-prompt p {
  font-size: 0.83rem;
  color: var(--muted);
  margin-bottom: 1rem;
}
#pickup-notice {
  position: absolute;
  bottom: 12%;
  left: 50%;
  transform: translateX(-50%);
  color: #fff0b3;
  background: #1e1736db;
  border: 1px solid #786292;
  border-radius: 0.3rem;
  padding: 0.45rem 0.8rem;
  font: 700 0.79rem var(--mono);
  pointer-events: none;
}
.control-strip {
  display: flex;
  align-items: center;
  min-height: 3.2rem;
  gap: 1.6rem;
  padding: 0 0.15rem;
  color: #a09caf;
  font-size: 0.77rem;
}
.control-item {
  display: flex;
  align-items: center;
  gap: 0.48rem;
  white-space: nowrap;
}
.control-item .icon {
  color: #bbb5c9;
}
.control-item kbd {
  font: 600 0.71rem var(--mono);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.28rem;
  height: 1.36rem;
  border: 1px solid #42404f;
  border-bottom-width: 2px;
  border-radius: 0.24rem;
  background: #20202b;
  color: #d4cfdf;
  padding: 0 0.26rem;
}
.key-pair {
  display: inline-flex;
  gap: 0.17rem;
}
.key-or {
  color: #645d73;
}
.hud {
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}
.card {
  border: 1px solid var(--line);
  border-radius: 0.65rem;
  padding: 1.2rem 1.25rem;
  background: linear-gradient(125deg, #1b1a26, #15151f 85%);
}
.card-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #b2a5c8;
}
.score-card {
  background:
    radial-gradient(ellipse at 85% 0%, #32223e 0%, transparent 75%), linear-gradient(125deg, #211b2b, #191721);
  border-color: #3b314a;
}
.score-bars {
  align-items: flex-end;
  gap: 0.16rem;
  height: 0.9rem;
}
.score-bars i {
  width: 0.19rem;
  background: #b48ad1;
}
.score-bars i:nth-child(1) {
  height: 30%;
}
.score-bars i:nth-child(2) {
  height: 55%;
}
.score-bars i:nth-child(3) {
  height: 78%;
}
.score-bars i:nth-child(4) {
  height: 100%;
}
.score-digits {
  color: #ebd8ff;
  height: clamp(3rem, 6.8vh, 4.7rem);
  display: flex;
  align-items: center;
}
.score-digits .pixel {
  width: 80%;
  height: 2.12rem;
  max-width: 13.5rem;
  filter: drop-shadow(0 0 0.55rem #a25eff31);
}
.best-line {
  border-top: 1px solid #3a3046;
  padding-top: 0.8rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.81rem;
}
.best-line span,
.data-line > span {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  color: #b4afc4;
}
.best-line svg {
  color: #e1b66b;
}
.best-line strong,
.data-line strong,
.progress-heading strong {
  font-family: var(--mono);
  font-weight: 560;
  color: #ded7e9;
}
.data-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 0.96rem;
  font-size: 0.89rem;
}
.data-line svg {
  color: #9592ab;
}
#lives {
  display: flex;
  align-items: center;
  gap: 0.27rem;
  color: #fe75a4;
}
#lives svg {
  height: 0.84rem;
  width: 1rem;
  color: #fe75a4;
  filter: drop-shadow(0 0 0.3rem #df478739);
}
#lives small {
  font-size: 0.8rem;
}
.campaign-progress {
  border-top: 1px solid var(--line);
  margin-top: 1.1rem;
  padding-top: 0.82rem;
}
.progress-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  text-transform: none;
  letter-spacing: 0;
  font-family: var(--sans);
  font-size: 0.77rem;
  font-weight: 450;
  color: #aaa4ba;
}
#progress-bars {
  display: flex;
  gap: 0.22rem;
  margin-top: 0.55rem;
}
#progress-bars i {
  display: block;
  flex: 1;
  height: 0.32rem;
  background: #343040;
  border-radius: 1px;
}
#progress-bars i.on {
  background: #aa88f1;
}
.guide-card {
  padding-bottom: 0.85rem;
}
.guide-heading {
  display: flex;
  align-items: center;
  gap: 0.65rem;
}
.guide-heading h2 {
  font-size: 1.05rem;
  letter-spacing: -0.025em;
}
.guide-book {
  color: var(--purple);
}
.guide-row {
  display: flex;
  align-items: center;
  gap: 0.72rem;
  margin-top: 1rem;
}
.tile-icon {
  width: 2.38rem;
  height: 2.38rem;
  flex-shrink: 0;
  border: 1px solid color-mix(in srgb, currentColor 27%, transparent);
  border-radius: 0.42rem;
  background: color-mix(in srgb, currentColor 8%, #15141e);
  display: grid;
  place-items: center;
}
.tile-icon .pixel {
  width: 1.4rem;
  height: 1.4rem;
}
.guide-row strong,
.guide-row small {
  display: block;
}
.guide-row strong {
  font-size: 0.87rem;
  font-weight: 630;
}
.guide-row small {
  font-size: 0.74rem;
  line-height: 1.4;
  color: #aca7bc;
  margin-top: 0.13rem;
}
.guide-button {
  margin-top: 1.05rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  border: 1px solid #463a5a;
  border-radius: 0.35rem;
  background: #282132;
  color: #ceb7ee;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.55rem 0.7rem;
}
.guide-button .icon {
  width: 0.95rem;
}
#workshop,
#scores-view {
  height: 100%;
  overflow: auto;
}
#scores-view {
  max-width: 68rem;
  margin: auto;
}
.score-page-head {
  margin: 1rem 0 1.5rem;
}
.score-page-head h1 {
  margin: 0.35rem 0;
}
.score-page-head p,
.dialog-desc {
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.6;
}
.ranking-card {
  padding: 0;
  overflow: hidden;
}
.ranking-card table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.88rem;
}
.ranking-card th {
  font: 600 0.72rem var(--mono);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  background: #201d2a;
}
.ranking-card th,
.ranking-card td {
  padding: 0.77rem 1.25rem;
  border-bottom: 1px solid var(--line);
}
.ranking-card tr:last-child td {
  border: 0;
}
.ranking-card td:first-child,
.ranking-card td:last-child {
  font-family: var(--mono);
}
.ranking-card td:last-child,
.ranking-card th:last-child {
  text-align: right;
}
.ranking-card .vacant {
  color: #716b80;
}
.ranking-card .rank-top {
  color: #ebc77c;
}
.ranking-card .new-run {
  background: #282033;
}
.champ-eyebrow {
  color: var(--purple);
}
dialog {
  border: 1px solid #51445f;
  border-radius: 0.75rem;
  padding: 0;
  background: #191721;
  color: var(--text);
  width: min(33rem, 92vw);
  max-height: 86dvh;
  box-shadow: 0 2rem 8rem #0009;
}
dialog::backdrop {
  background: #06060cbf;
  backdrop-filter: blur(4px);
}
dialog.wide {
  width: min(55rem, 94vw);
}
#modal-content {
  padding: 1.55rem;
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
}
.modal-head h2 {
  font-size: 1.55rem;
  letter-spacing: -0.035em;
}
.modal-head .icon-button {
  width: 2rem;
  height: 2rem;
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.75rem;
  margin-top: 1.4rem;
}
.guide-tabs {
  display: flex;
  gap: 0.5rem;
  border-bottom: 1px solid var(--line);
  padding-bottom: 0.75rem;
  margin-bottom: 0.8rem;
}
.guide-tabs button {
  color: var(--muted);
  font-size: 0.85rem;
  padding: 0.55rem 0.9rem;
  border-radius: 0.35rem;
}
.guide-tabs button.active {
  background: #30253f;
  color: #d7b7ff;
}
.guide-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.55rem;
}
.guide-entry {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  border: 1px solid var(--line);
  padding: 0.65rem;
  border-radius: 0.4rem;
  min-width: 0;
}
.guide-entry strong {
  font-size: 0.85rem;
  display: block;
}
.guide-entry p {
  font-size: 0.76rem;
  color: #b0aabd;
  line-height: 1.4;
  margin-top: 0.2rem;
}
.brick-swatch {
  width: 1.8rem;
  height: 0.85rem;
  border-top: 2px solid #ffffff75;
  border-bottom: 2px solid #0006;
  background: var(--c);
  box-shadow:
    inset 2px 0 #ffffff30,
    inset -2px 0 #0004;
}
.score-form label {
  margin: 0.85rem 0 0.4rem;
  display: block;
  font-size: 0.85rem;
}
.score-form input {
  padding: 0.6rem;
  width: 100%;
  background: #0f0f17;
  border: 1px solid #4b4159;
  border-radius: 0.3rem;
  color: white;
}
.result-points {
  font: 700 1.35rem var(--mono);
  color: #d9c0ff;
  margin: 0.5rem 0;
}
#toast {
  position: fixed;
  bottom: 1.4rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;

  padding: 11px 19px;
  color: #c7f4e4;
  background: #1b302c;
  box-shadow: 0 6px 22px #0006;
  font-size: 0.85rem;
  text-align: center;
  pointer-events: none;
}
.wk-toast.error {
  color: #ffd6db;
  border-color: #ac6269;
  background: #3b242d;
}
.wk-toast[hidden] {
  display: none;
}
@media (min-width: 1750px) {
  .wk-wrap {
    width: min(88%, 95rem);
  }
  .wk-play-card .wk-art {
    height: 11rem;
  }
}
@media (max-width: 1080px) {
  .wk-cards {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .wk-material {
    gap: 14px;
  }
  .wk-grid {
    aspect-ratio: 3 / 1;
  }
}
@media (max-width: 760px) {
  .wk-wrap {
    padding-inline: 14px;
  }
  .wk-editor {
    grid-template-columns: 1fr;
  }
  .wk-cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .wk-grid {
    aspect-ratio: 2.6 / 1;
  }
  .wk-tabs {
    gap: 0;
  }
  .wk-tab svg {
    display: none;
  }
  .wk-screen .wk-tab {
    padding-inline: 8px;
  }
  .wk-settings-fields {
    grid-template-columns: 1fr 1fr;
    align-items: center;
  }
  .wk-screen .wk-swatch {
    width: 21px;
  }
}
@media (max-width: 470px) {
  .wk-head {
    gap: 8px;
  }
  .wk-screen .wk-button {
    padding-inline: 10px;
    font-size: 0.78rem;
  }
  .wk-card-foot {
    gap: 5px;
    padding: 8px 5px;
  }
  .wk-card-foot .wk-number {
    display: none;
  }
  .wk-card-actions .wk-icon {
    width: 25px;
  }
  .wk-screen .wk-tab {
    font-size: 0.72rem;
    padding-inline: 5px;
    gap: 4px;
  }
  .wk-tab span {
    min-width: 17px;
    font-size: 0.6rem;
  }
  .wk-card-label h2 {
    font-size: 0.77rem;
  }
  .wk-grid-box {
    margin: 12px 10px 0;
  }
  .wk-grid,
  .wk-grid-row {
    gap: 2px;
  }
  .wk-grid {
    aspect-ratio: 2 / 1;
  }
  .wk-tools {
    margin-inline: 10px;
  }
  .wk-material {
    padding-inline: 10px;
    grid-template-columns: minmax(90px, 1fr) minmax(140px, 1.2fr);
  }
  .wk-order-row {
    gap: 7px;
    padding: 6px;
  }
  .wk-order-row .wk-art {
    display: none;
  }
  .wk-row-actions .wk-icon {
    width: 26px;
  }
  .wk-settings-fields {
    grid-template-columns: 1fr;
  }
}
@media (prefers-reduced-motion: reduce) {
  .wk-screen *,
  .wk-screen *::before,
  .wk-screen *::after {
    transition-duration: 0s !important;
  }
}

                <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span

                <div id="arena-status"><i></i><span></span></div>

                <div class="progress-heading">
                  <span id="progress-label"></span><strong id="progress-value"></strong>
                </div>
                <div id="progress-bars"></div>
              </div>
            </section>
            <section class="card guide-card">
              <div class="guide-heading">
                <span class="guide-book" id="guide-icon"></span>
                <h2 id="guide-heading"></h2>
              </div>
              <div id="guide-list"></div>
              <button id="guide-button" class="guide-button"></button>
            </section>
          </aside>
        </div>
      </section>
      <section id="workshop" hidden></section>
      <section id="scores-view" hidden></section>
    </main>
